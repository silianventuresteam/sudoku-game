    <style>

        #board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); background: #4a2e5d; border: 2px solid #4a2e5d; gap: 1px; border-radius: 6px; overflow: hidden; width: 100%; aspect-ratio: 1 / 1; max-width: 380px; box-shadow: 0 4px 12px rgba(74,46,93,0.1); margin-bottom: 14px; }

    <script>
        const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxdHm3PSA01HBRbC0nMi2Idn0Ej0QOaRc4-EW4Dex_o-yVQqZndI9mzX0ZH-KTtgbwC/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const board = document.getElementById("board");
            const timerDisplay = document.getElementById("timer");
            const streakDisplay = document.getElementById("streak");
            const engagementBanner = document.getElementById("engagement-banner");
            const statusDisplay = document.getElementById("game-status");
            const newGameBtn = document.getElementById("new-game");
            const hintBtn = document.getElementById("hint-btn");
            const undoBtn = document.getElementById("undo-btn");
            const tabs = document.querySelectorAll(".tab");
            const numBtns = document.querySelectorAll(".num-btn");

            const authModal = document.getElementById("auth-modal-overlay");
            const closeAuthModalBtn = document.getElementById("close-auth-modal");
            const googleSigninBtn = document.getElementById("google-signin-btn");
            const appleSigninBtn = document.getElementById("apple-signin-btn");

            let timer = 0;
            let timerInterval = null;
            let streak = 0;
            let selectedCell = null;
            let currentDifficulty = "easy";
            let moveHistory = [];
            let currentSolutionStr = "";

            setTimeout(() => {
                authModal.style.display = "flex";
            }, 10000);

            closeAuthModalBtn.addEventListener("click", () => {
                authModal.style.display = "none";
            });

            function handleAuthSubmission(providerName) {
                let userEmail = prompt(`Sign in with ${providerName}\nEnter your verified email address to secure your streak:`);
                if (!userEmail || !userEmail.includes("@")) return;

                authModal.style.display = "none";

                if (SHEET_WEBHOOK_URL && SHEET_WEBHOOK_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                    fetch(SHEET_WEBHOOK_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: userEmail, source: providerName })
                    }).catch(err => console.error("Webhook sync error:", err));
                }

                alert(`Successfully signed in with ${providerName}! Your email has been saved.`);
            }

            googleSigninBtn.addEventListener("click", () => handleAuthSubmission("Google"));
            appleSigninBtn.addEventListener("click", () => handleAuthSubmission("Apple"));

            function initStreak() {
                const savedStreak = localStorage.getItem("sudoku_streak");
                const lastPlayDate = localStorage.getItem("sudoku_last_play");
                const today = new Date().toISOString().split('T')[0];

                if (savedStreak && lastPlayDate) {
                    const lastDate = new Date(lastPlayDate);
                    const currentDate = new Date(today);
                    const diffTime = Math.abs(currentDate - lastDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (lastPlayDate === today || diffDays === 1) {
                        streak = parseInt(savedStreak, 10);
                        engagementBanner.textContent = "🔥 Streak active! Keep playing to build higher.";
                    } else {
                        streak = 0;
                        localStorage.setItem("sudoku_streak", 0);
                        engagementBanner.textContent = "⚡ Streak reset! Play today to start a new run.";
                    }
                } else {
                    streak = 0;
                    engagementBanner.textContent = "🔥 Welcome! Solve a puzzle today to start your streak.";
                }
                streakDisplay.textContent = `🔥 Streak: ${streak}`;
            }

            function recordWinStreak() {
                const today = new Date().toISOString().split('T')[0];
                const lastPlayDate = localStorage.getItem("sudoku_last_play");

                if (lastPlayDate !== today) {
                    streak++;
                    localStorage.setItem("sudoku_streak", streak);
                    localStorage.setItem("sudoku_last_play", today);
                }
                streakDisplay.textContent = `🔥 Streak: ${streak}`;
                engagementBanner.textContent = "🔥 Streak active! Keep playing to build higher.";
            }

            initStreak();

            function startTimer() {
                clearInterval(timerInterval);
                timer = 0;
                timerInterval = setInterval(() => {
                    timer++;
                    let mins = Math.floor(timer / 60).toString().padStart(2, '0');
                    let secs = (timer % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `⏱️ ${mins}:${secs}`;
                }, 1000);
            }

            function isValid(grid, row, col, num) {
                for (let x = 0; x < 9; x++) {
                    if (grid[row][x] === num || grid[x][col] === num) return false;
                }
                let startRow = row - (row % 3), startCol = col - (col % 3);
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (grid[r + startRow][c + startCol] === num) return false;
                    }
                }
                return true;
            }

            function solveGrid(grid) {
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if (grid[r][c] === 0) {
                            let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
                            for (let num of nums) {
                                if (isValid(grid, r, c, num)) {
                                    grid[r][c] = num;
                                    if (solveGrid(grid)) return true;
                                    grid[r][c] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }

            function generateSudoku(diff) {
                let grid = Array(9).fill(0).map(() => Array(9).fill(0));
                solveGrid(grid);
                let solutionGrid = grid.map(row => [...row]);
                
                let clues = 45;
                if (diff === "medium") clues = 32;
                if (diff === "hard") clues = 25;

                let puzzleGrid = solutionGrid.map(row => [...row]);
                let removed = 81 - clues;
                while (removed > 0) {
                    let r = Math.floor(Math.random() * 9);
                    let c = Math.floor(Math.random() * 9);
                    if (puzzleGrid[r][c] !== 0) {
                        puzzleGrid[r][c] = 0;
                        removed--;
                    }
                }

                return {
                    puzzle: puzzleGrid.flat().join("").replace(/0/g, "0"),
                    solution: solutionGrid.flat().join("")
                };
            }

            function loadBoard(diff) {
                board.innerHTML = "";
                selectedCell = null;
                moveHistory = [];
                statusDisplay.textContent = "Game On!";
                statusDisplay.style.color = "#2e7d32";
                startTimer();

                const data = generateSudoku(diff);
                const puzzleStr = data.puzzle;
                currentSolutionStr = data.solution;

                for (let i = 0; i < 81; i++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    const val = puzzleStr[i];
                    cell.dataset.index = i;
                    cell.dataset.solution = currentSolutionStr[i];

                    if (val !== "0") {
                        cell.textContent = val;
                        cell.classList.add("preset");
                    } else {
                        cell.addEventListener("click", () => {
                            document.querySelectorAll(".cell").forEach(c => c.classList.remove("selected"));
                            selectedCell = cell;
                            cell.classList.add("selected");
                        });
                    }
                    board.appendChild(cell);
                }
            }

            function checkWinCondition() {
                const cells = document.querySelectorAll(".cell");
                let complete = true;
                let correct = true;

                cells.forEach(cell => {
                    if (!cell.textContent) {
                        complete = false;
                    } else if (cell.textContent !== cell.dataset.solution) {
                        correct = false;
                    }
                });

                if (complete) {
                    clearInterval(timerInterval);
                    if (correct) {
                        statusDisplay.textContent = "Solved Successfully! 🎉";
                        statusDisplay.style.color = "#2e7d32";
                        
                        recordWinStreak();

                        const count = 200;
                        const defaults = { origin: { y: 0.7 } };

                        function fire(particleRatio, opts) {
                            confetti(Object.assign({}, defaults, opts, {
                                particleCount: Math.floor(count * particleRatio)
                            }));
                        }

                        fire(0.25, { spread: 26, startVelocity: 55, shapes: ['circle', 'square', 'triangle'], colors: ['#00acc1', '#ff8f00', '#fbc02d', '#7b1fa2', '#d32f2f'] });
                        fire(0.2, { spread: 60, shapes: ['circle'], colors: ['#00acc1', '#fbc02d'] });
                        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8, shapes: ['circle', 'triangle'], colors: ['#ff8f00', '#7b1fa2', '#d32f2f'] });
                        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2, shapes: ['star'], colors: ['#00acc1', '#fbc02d'] });

                        const timeStr = timerDisplay.textContent;
                        const modalHTML = `
                          <div id="shareModalOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; justify-content: center; align-items: center; animation: fadeIn 0.3s;">
                            <div style="background: white; padding: 30px 24px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; max-width: 360px; width: 90%;">
                              <span id="closeModal" style="position: absolute; top: 12px; right: 18px; font-size: 24px; cursor: pointer; color: #666;">&times;</span>
                              <h2 style="color: #4a2e5d; margin-bottom: 8px; font-size: 20px;">CONGRATULATIONS!</h2>
                              <p style="font-size: 13px; color: #666; margin-bottom: 12px;">You solved the ${currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1)} puzzle in:</p>
                              <p style="font-size: 2.4em; font-weight: bold; color: #4a2e5d; margin: 10px 0;">${timeStr.replace('⏱️ ', '')}</p>
                              <p style="font-size: 13px; color: #666; margin-bottom: 20px;">🔥 Current Streak: ${streak}</p>
                              <button id="shareButton" style="background: #4a2e5d; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s;">
                                Share Result
                              </button>
                            </div>
                          </div>
                        `;
                        document.body.insertAdjacentHTML('beforeend', modalHTML);

                        document.getElementById('shareButton').addEventListener('click', () => {
                          const shareText = `I just beat the ${currentDifficulty} Sudoku in ${timeStr.replace('⏱️ ', '')} with a 🔥 ${streak}-day streak! Can you beat my score? Play here: https://sudoku.silianventures.com`;
                          navigator.clipboard.writeText(shareText).then(() => {
                            alert('Result copied to clipboard! Paste it to share with friends.');
                          });
                        });
                        document.getElementById('closeModal').addEventListener('click', () => {
                          document.getElementById('shareModalOverlay').remove();
                        });
                        document.getElementById('shareModalOverlay').addEventListener('click', (e) => {
                          if (e.target === document.getElementById('shareModalOverlay')) {
                            document.getElementById('shareModalOverlay').remove();
                          }
                        });

                    } else {
                        statusDisplay.textContent = "Contains errors.";
                        statusDisplay.style.color = "#d32f2f";
                    }
                }
            }

            numBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    if (!selectedCell || selectedCell.classList.contains("preset")) return;
                    const oldValue = selectedCell.textContent;
                    
                    if (btn.classList.contains("clr-btn")) {
                        selectedCell.textContent = "";
                        selectedCell.classList.remove("error");
                        moveHistory.push({ cell: selectedCell, val: oldValue });
                    } else {
                        const num = btn.textContent;
                        selectedCell.textContent = num;
                        moveHistory.push({ cell: selectedCell, val: oldValue });

                        if (num !== selectedCell.dataset.solution) {
                            selectedCell.classList.add("error");
                        } else {
                            selectedCell.classList.remove("error");
                        }
                    }
                    checkWinCondition();
                });
            });

            undoBtn.addEventListener("click", () => {
                if (moveHistory.length === 0) return;
                const lastMove = moveHistory.pop();
                lastMove.cell.textContent = lastMove.val;
                lastMove.cell.classList.remove("error");
                document.querySelectorAll(".cell").forEach(c => c.classList.remove("selected"));
                selectedCell = lastMove.cell;
                selectedCell.classList.add("selected");
            });

            hintBtn.addEventListener("click", () => {
                if (!selectedCell || selectedCell.classList.contains("preset")) {
                    statusDisplay.textContent = "Select empty cell!";
                    statusDisplay.style.color = "#d32f2f";
                    return;
                }
                const correctVal = selectedCell.dataset.solution;
                const oldValue = selectedCell.textContent;
                selectedCell.textContent = correctVal;
                selectedCell.classList.remove("error");
                moveHistory.push({ cell: selectedCell, val: oldValue });
                statusDisplay.textContent = "Hint applied!";
                statusDisplay.style.color = "#4a2e5d";
                checkWinCondition();
            });

            tabs.forEach(tab => {
                tab.addEventListener("click", () => {
                    tabs.forEach(t => t.classList.remove("active"));
                    tab.classList.add("active");
                    currentDifficulty = tab.getAttribute("data-diff");
                    loadBoard(currentDifficulty);
                });
            });

            newGameBtn.addEventListener("click", () => {
                loadBoard(currentDifficulty);
            });

            loadBoard(currentDifficulty);
        });
    </script>
</body>
</html>
